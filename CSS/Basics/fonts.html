<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Document</title>
     <style>
          h1{
               font-family: 'Courier New', Arial;
               font-size: 40px;
               font-style: italic;
          }
          p{
               font-family: Arial;
               font-size: 40px;
               font-style: italic;
               font-variant: small-caps;
               font-weight: 600;
          }
          p.courier{
               color: red;
          }
     </style>
</head>
<body>
    <h1>This is a nice font</h1>
    <p class="courier">This is text for para elements</p>
    <p>Hello, this is a p tag</p>
</body>
</html>
