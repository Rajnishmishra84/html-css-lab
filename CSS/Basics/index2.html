<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Document</title>
     <style>
          /*Element[attribute]*/
          p[class] {
               background-color: olive;
          }
          p[class="fourth"] { 
               color: orange;
               background-color: red;
          }
     </style> 
</head>
<body>
     <p class="first">This is first para</p>
     <p class="second">This is second para</p>
     <p id="third">This is third para</p>
     <p class="fourth">This is fourth para</p>
</body>
</html>
